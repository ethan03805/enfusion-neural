name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . -r requirements-docs.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_docs.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: cmake -S native -B build -A x64
      - run: cmake --build build --config Release
      - run: python scripts/gpu_smoke.py --allow-no-gpu
